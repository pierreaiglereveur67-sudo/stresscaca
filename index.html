<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre pourcentage, votre avis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0f5; --card:#ffffff; --ink:#12263a; --muted:#5b6f82;
  --accent:#1f6f8b; --accent-ink:#ffffff; --line:#cdd9e3; --err:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a26; --card:#162636; --ink:#e6eef5; --muted:#92a6b8;
    --accent:#5cb7d6; --accent-ink:#0e1a26; --line:#27405a; --err:#ff8a80;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5; padding:24px 16px 64px;
}
main{max-width:640px; margin:0 auto}
h1{font-size:clamp(1.6rem,5vw,2.2rem); font-weight:800; margin:8px 0 24px; letter-spacing:-.02em}
.avg{display:flex; align-items:baseline; gap:12px; margin-bottom:8px}
.avg strong{font-size:clamp(3.5rem,16vw,6rem); font-weight:800; line-height:1; letter-spacing:-.04em}
.avg span{color:var(--muted)}
.bar{height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:32px}
.bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .6s ease}
form{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:32px}
label{display:block; font-weight:600; margin-bottom:6px}
.row{display:flex; gap:16px; align-items:center; margin-bottom:18px}
input[type=range]{flex:1; accent-color:var(--accent); height:28px}
.num{display:flex; align-items:center; gap:4px}
input[type=number]{width:76px; font:inherit; font-weight:600; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); text-align:right}
textarea{width:100%; min-height:90px; resize:vertical; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink)}
:is(input,textarea,button):focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:12px}
.count{color:var(--muted); font-size:.85rem}
button{font:inherit; font-weight:600; background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px; padding:10px 20px; cursor:pointer}
button:disabled{opacity:.5; cursor:wait}
.msg{min-height:1.4em; margin-top:10px; font-size:.9rem}
.msg.err{color:var(--err)}
h2{font-size:1.1rem; margin:0 0 12px}
ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
li{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px}
li b{font-size:1.4rem; font-weight:800; grid-row:span 2}
li p{margin:0; overflow-wrap:anywhere; white-space:pre-wrap}
li time{color:var(--muted); font-size:.8rem}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Votre pourcentage, votre avis</h1>

  <div class="avg" aria-live="polite"><strong id="avg">–</strong><span id="avgLabel">Aucune réponse pour l’instant</span></div>
  <div class="bar"><i id="avgBar"></i></div>

  <form id="form">
    <label for="pct">Pourcentage</label>
    <div class="row">
      <input type="range" id="range" min="0" max="100" value="50" aria-label="Curseur de pourcentage">
      <div class="num"><input type="number" id="pct" min="0" max="100" value="50" required> <span>%</span></div>
    </div>

    <label for="comment">Commentaire</label>
    <textarea id="comment" maxlength="500" required placeholder="Expliquez votre réponse…"></textarea>

    <div class="foot">
      <span class="count" id="count">0 / 500</span>
      <button type="submit" id="send">Envoyer ma réponse</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <h2>Réponses de tous les visiteurs</h2>
  <ul id="list"><li class="empty">Chargement…</li></ul>
</main>

<script>
// ====== À CONFIGURER (voir les instructions Supabase) ======
const SUPABASE_URL = "https://VOTRE-PROJET.supabase.co";
const SUPABASE_KEY = "VOTRE_CLE_ANON_PUBLIQUE";
// ============================================================

const $ = id => document.getElementById(id);
const API = SUPABASE_URL + "/rest/v1/entries";
const H = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

const range = $("range"), pct = $("pct"), comment = $("comment");
range.oninput = () => pct.value = range.value;
pct.oninput = () => { const v = Math.max(0, Math.min(100, +pct.value || 0)); range.value = v; };
comment.oninput = () => $("count").textContent = comment.value.length + " / 500";

function say(text, err) { const m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }

async function load() {
  try {
    const r = await fetch(API + "?select=*&order=created_at.desc&limit=200", { headers: H });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("list").innerHTML = "";
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "Impossible de charger les réponses. Vérifiez la configuration Supabase.";
    $("list").appendChild(li);
  }
}

function render(rows) {
  const list = $("list"); list.innerHTML = "";
  if (!rows.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = "Aucune réponse. Soyez le premier à répondre.";
    list.appendChild(li);
    $("avg").textContent = "–"; $("avgLabel").textContent = "Aucune réponse pour l’instant"; $("avgBar").style.width = "0";
    return;
  }
  const avg = rows.reduce((s, r) => s + r.percentage, 0) / rows.length;
  $("avg").textContent = Math.round(avg) + " %";
  $("avgLabel").textContent = "moyenne sur " + rows.length + " réponse" + (rows.length > 1 ? "s" : "");
  $("avgBar").style.width = avg + "%";
  for (const r of rows) {
    const li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = r.percentage + " %";
    const p = document.createElement("p"); p.textContent = r.comment;
    const t = document.createElement("time");
    t.textContent = new Date(r.created_at).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
    li.append(b, p, t); list.appendChild(li);
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const value = Math.round(+pct.value), text = comment.value.trim();
  if (!(value >= 0 && value <= 100)) return say("Entrez un pourcentage entre 0 et 100.", true);
  if (!text) return say("Ajoutez un commentaire.", true);
  $("send").disabled = true; say("Envoi en cours…");
  try {
    const r = await fetch(API, { method: "POST", headers: { ...H, Prefer: "return=minimal" }, body: JSON.stringify({ percentage: value, comment: text }) });
    if (!r.ok) throw new Error(r.status);
    comment.value = ""; $("count").textContent = "0 / 500";
    say("Réponse envoyée. Merci !");
    load();
  } catch (err) {
    say("L’envoi a échoué. Réessayez dans un instant.", true);
  } finally { $("send").disabled = false; }
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
